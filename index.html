<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIR_GIM WALLPAPER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050816;color:#fff;font-family:Tahoma,Arial}
header{text-align:center;padding:30px 10px;background:linear-gradient(135deg,#071b35,#151033);border-bottom:2px solid #00bfff}
h1{color:#00c8ff;text-shadow:0 0 15px #008cff}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:15px}
button{background:#101a30;color:white;border:1px solid #00aaff;border-radius:10px;padding:10px;cursor:pointer}
button.active,button:hover{background:#007fc7}
input{display:block;width:90%;max-width:500px;margin:10px auto;padding:13px;border-radius:10px;border:1px solid #00aaff;background:#101a30;color:white}
h2{text-align:center;color:#00c8ff}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;padding:14px;max-width:1200px;margin:auto}
.card{background:#101a30;border:1px solid #12436a;border-radius:12px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover;display:block}
.card h3{font-size:13px;padding:0 10px}
.card a{display:block;text-align:center;background:#007fc7;color:white;padding:10px;text-decoration:none;margin:10px;border-radius:8px}
footer{text-align:center;padding:25px;color:#a9c6dc}
</style>
</head>
<body>
<header>
<h1>AMIR_GIM WALLPAPER</h1>
<p>⚽ فوتبال | 👑 ایران باستان | 🇮🇷 طبیعت ایران | 🎮 گیمینگ</p>
</header>

<nav id="filters">
<button class="active" data-cat="all">همه</button>
<button data-cat="football">فوتبال</button>
<button data-cat="iran">ایران باستان</button>
<button data-cat="nature">طبیعت ایران</button>
<button data-cat="gaming">گیمینگ</button>
</nav>

<input id="search" placeholder="🔍 جست‌وجوی والپیپر...">
<h2>گالری والپیپرها</h2>
<div class="gallery" id="gallery"></div>
<footer>ساخته‌شده با 💙 برای AMIR_GIM</footer>

<script>
const photos=[
["فوتبال و ورزشگاه","football","https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=700&q=80"],
["توپ فوتبال","football","https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=700&q=80"],
["استادیوم فوتبال","football","https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=700&q=80"],
["تخت جمشید","iran","https://images.unsplash.com/photo-1568322445389-f64ac2515020?auto=format&fit=crop&w=700&q=80"],
["بنای تاریخی","iran","https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=700&q=80"],
["کوهستان","nature","https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"],
["طبیعت زیبا","nature","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"],
["گیمینگ","gaming","https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=700&q=80"],
["ستاپ گیمینگ","gaming","https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=700&q=80"]
];

const gallery=document.getElementById("gallery");
const search=document.getElementById("search");
let category="all";

function showPhotos(){
 const q=search.value.trim().toLowerCase();
 gallery.innerHTML="";
 const found=photos.filter(p=>(category==="all"||p[1]===category)&&p[0].toLowerCase().includes(q));
 found.forEach(p=>{
  const card=document.createElement("div");
  card.className="card";
  const img=document.createElement("img");
  img.src=p[2];img.alt=p[0];img.loading="lazy";
  const title=document.createElement("h3");
  title.textContent=p[0];
  const link=document.createElement("a");
  link.href=p[2];link.target="_blank";link.rel="noopener";
  link.textContent="مشاهده و ذخیره";
  card.append(img,title,link);
  gallery.appendChild(card);
 });
}
document.querySelectorAll("#filters button").forEach(b=>{
 b.onclick=()=>{
  category=b.dataset.cat;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");showPhotos();
 };
});
search.addEventListener("input",showPhotos);
showPhotos();
</script>
</body>
</html>
